# docker compose run --rm dev cargo test
# The :Z suffix relabels the bind mount for SELinux. Never disable SELinux.
services:
  dev:
    build:
      context: .
      target: dev
    image: kyte-dev
    working_dir: /src
    volumes:
      - ./:/src:Z
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/src/target
    environment:
      TERM: xterm-256color
    command: ["cargo", "test"]

volumes:
  cargo-cache:
  target-cache:
